
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f9;
            padding: 15px;
        }

        /* Main Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 170px auto 150px;
            gap: 12px;
        }

        /* Header */
        .header {
            grid-column: 1 / 3;
            background-color: #11203d;
            color: white;
            padding: 18px;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 28px;
        }

        /* Sidebar */
        .sidebar {
            background-color: #dce6fa;
            padding: 18px;
            border-radius: 12px;
        }

        .sidebar h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .sidebar ul {
            padding-left: 22px;
            line-height: 32px;
            font-size: 20px;
        }

        /* Cards Grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 85px;
            gap: 15px;
            align-content: start;
        }

        .card {
            background-color: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 12px;
        }

        .icon {
            font-size: 35px;
        }

        .card p {
            font-size: 20px;
        }

        .card strong {
            font-size: 20px;
        }

        /* Footer */
        .footer {
            grid-column: 1 / 3;
            background-color: #11203d;
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        /* Responsive */
        @media (max-width: 850px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .header,
            .footer {
                grid-column: 1;
                min-height: 120px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <h1>My Dashboard</h1>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- Dashboard Cards -->
        <main class="cards">

            <div class="card">
                <span class="icon">👤</span>
                <p><strong>120</strong><br>Users</p>
            </div>

            <div class="card">
                <span class="icon">💰</span>
                <p><strong>Rs 45k</strong><br>Sales</p>
            </div>

            <div class="card">
                <span class="icon">📦</span>
                <p><strong>36</strong><br>Orders</p>
            </div>

            <div class="card">
                <span class="icon">⭐</span>
                <p><strong>4.8</strong><br>Rating</p>
            </div>

            <div class="card">
                <span class="icon">💬</span>
                <p><strong>18</strong><br>Messages</p>
            </div>

            <div class="card">
                <span class="icon">✅</span>
                <p><strong>92%</strong><br>Done</p>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            Made with CSS Grid
        </footer>

    </div>

</body>
</html>
