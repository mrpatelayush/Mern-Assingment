
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WanderGo - Travel Website</title>

    <style>

        /* Basic Styling */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }

        /* Navbar */

        .navbar {
            background-color: #14233f;
            color: white;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
        }

        .logo {
            font-size: 1.5rem;
        }

        nav {
            display: flex;
            gap: 1rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
        }

        /* Hero Section */

        .hero {
            background-color: #315bea;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }

        .hero h1 {
            font-size: 1.5rem;
            margin-bottom: 0.4rem;
        }

        .hero p {
            font-size: 1rem;
        }

        .hero-image {
            width: 100%;
            max-width: 600px;
            height: 180px;
            background-color: #a5b9f0;
            border-radius: 0.7rem;
            margin: 1rem auto 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero-image img {
            max-width: 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Features Section */

        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            padding: 1rem;
            background-color: white;
        }

        .feature-card {
            background-color: #edf1ff;
            padding: 1.5rem 1rem;
            text-align: center;
            border-radius: 0.7rem;
        }

        .feature-card h3 {
            font-size: 1.1rem;
            color: #14233f;
        }

        .feature-card p {
            font-size: 1rem;
        }

        /* Footer */

        footer {
            background-color: #14233f;
            color: white;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }

        /* Tablet Layout - 768px */

        @media (min-width: 768px) {

            .navbar {
                flex-direction: row;
                justify-content: space-between;
                padding: 1rem 2rem;
            }

            .hero {
                padding: 3rem 2rem;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero-image {
                height: 220px;
            }

            .features {
                grid-template-columns: repeat(2, 1fr);
                padding: 2rem;
            }
        }

        /* Desktop Layout - 1024px */

        @media (min-width: 1024px) {

            .navbar {
                padding: 1rem 3rem;
            }

            .hero {
                padding: 3rem 2rem;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .hero-image {
                max-width: 650px;
                height: 250px;
            }

            .features {
                grid-template-columns: repeat(3, 1fr);
                padding: 2rem;
            }

            .feature-card {
                padding: 1.5rem;
            }
        }

    </style>
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <h2 class="logo">WanderGo</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#trips">Trips</a>
            <a href="#contact">Contact</a>
        </nav>

    </header>

    <!-- Hero Section -->

    <main>

        <section class="hero" id="home">

            <h1>Plan your next trip in minutes</h1>

            <p>Simple, cheap and fun travel plans.</p>

            <div class="hero-image">

                <img src="img/hero.jpg" alt="Beautiful travel destination"
                     onerror="this.style.display='none'; this.parentElement.textContent='img/hero.jpg';">

            </div>

        </section>

        <!-- Features Section -->

        <section class="features" id="trips">

            <div class="feature-card">

                <h3>Easy Booking</h3>

                <p>Book in 3 clicks.</p>

            </div>

            <div class="feature-card">

                <h3>Best Prices</h3>

                <p>We compare for you.</p>

            </div>

            <div class="feature-card">

                <h3>24x7 Help</h3>

                <p>We are always here for you.</p>

            </div>

        </section>

    </main>

    <!-- Footer -->

    <footer id="contact">

        <p>© 2026 WanderGo. All Rights Reserved.</p>

    </footer>

</body>
</html>
